services:
  mosquitto:
    image: eclipse-mosquitto:2.1.2-alpine
    container_name: mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log

  influxdb:
    image: influxdb:2.7-alpine
    container_name: influxdb
    restart: unless-stopped
    ports:
      - "8086:8086"
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=${INFLUXDB_USERNAME}
      - DOCKER_INFLUXDB_INIT_ORG=${INFLUXDB_ORG}
      - DOCKER_INFLUXDB_INIT_BUCKET=${INFLUXDB_BUCKET}
      - DOCKER_INFLUXDB_INIT_RETENTION=${INFLUXDB_RETENTION}
      - DOCKER_INFLUXDB_INIT_PASSWORD_FILE=/run/secrets/influx_admin_password
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN_FILE=/run/secrets/influx_admin_token
    secrets:
      - influx_admin_password
      - influx_admin_token
    volumes:
      - ./influxdb/data:/var/lib/influxdb2
      - ./influxdb/config:/etc/influxdb2

  mqtt-bridge:
    build: ./scripts
    container_name: mqtt-bridge
    restart: unless-stopped
    depends_on:
      - mosquitto
      - influxdb
    env_file:
      - .env
    secrets:
      - influx_write_token

secrets:
  influx_admin_password:
    file: ./secrets/influx_admin_password.txt
  influx_admin_token:
    file: ./secrets/influx_admin_token.txt
  influx_write_token:
    file: ./secrets/influx_write_token.txt
